databases:
  - name: petstore-db
    plan: free

services:
  - type: web
    name: petstore-api
    runtime: docker
    dockerfilePath: ./infra/docker/backend.Dockerfile
    plan: free
    rootDir: .
    healthCheckPath: /api/musngi/catalog/categories
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: petstore-frontend
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: petstore-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: petstore-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
